name: 'Full-site link & image check'
description: >-
  Curl-based broken-link / image / outbound crawl of a WordPress site,
  driven by its Rank Math sitemap. A broken internal link/image or a dead
  outbound (404/410) fails the step; flaky externals are non-fatal. Can
  open and auto-close a GitHub issue with the broken-link report.

inputs:
  sitemap-url:
    description: 'Rank Math sitemap_index.xml URL to expand into the page list.'
    required: true
  host:
    description: 'Internal host. Links to this host + its subdomains are fatal if broken.'
    required: true
  verify-token:
    description: 'X-Verify-Source WAF-bypass token. Sent ONLY to the internal host.'
    required: false
    default: ''
  allow-file:
    description: 'Path (relative to the caller checkout) to a baselined-URL allow-list.'
    required: false
    default: 'scripts/linkcheck-allow.txt'
  workers:
    description: 'Concurrent curl workers.'
    required: false
    default: '10'
  manage-issue:
    description: 'Open/auto-close a GitHub issue on failure/clean. Needs `issues: write`.'
    required: false
    default: 'true'
  crawl-floor-fraction:
    description: >-
      Fault the run when this crawl covered fewer than <fraction> x the median
      page count of previous good runs. Guards the collapsed-crawl class: a
      truncated page set otherwise produces a confident verdict about a site
      that was never fetched. 0 disables the floor.
    required: false
    default: '0.5'
  crawl-floor-min-history:
    description: 'Good runs required before the floor arms. Below this, no run is judged.'
    required: false
    default: '3'
  manage-baseline:
    description: >-
      Persist the crawl-size history in the Actions cache (no repo write, no
      caller file). Set false to use a `.linkcheck-baseline.json` already in the
      workspace and skip the cache entirely — which is what the self-test does.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # The crawl-size history, restored from the Actions cache. NOT a caller file
    # and NOT a repo write: a size floor is worth nothing if it only protects the
    # callers who remembered to add something, and the incident it guards
    # (lampakia-astro run 33382684973) happened on a caller that had done
    # everything right. `restore` + `save` rather than `cache`, so the history is
    # written only by a run whose crawl we trust — see the record step.
    #
    # A cache miss is NOT a failure: `crawl-floor.py` reads the absent file as
    # `no-baseline` and judges nothing. Eviction (7 days unused) is real on a
    # weekly cron and degrades exactly that way — the floor disarms, says so in
    # the report, and re-arms after three good runs.
    - name: Restore the crawl-size baseline
      if: ${{ inputs.manage-baseline == 'true' }}
      uses: actions/cache/restore@v4
      with:
        path: .linkcheck-baseline.json
        key: linkcheck-baseline-v1-${{ inputs.host }}-${{ github.run_id }}
        restore-keys: |
          linkcheck-baseline-v1-${{ inputs.host }}-

    - name: Expand sitemap → page list
      id: sitemap
      shell: bash
      env:
        VERIFY_HOMEPAGE_TOKEN: ${{ inputs.verify-token }}
        # Same internal host the crawler uses, so the sitemap fetch scopes the
        # X-Verify-Source token to it (+ subdomains) and never carries it to a
        # cross-host child-sitemap or redirect target.
        LINKCHECK_HOST: ${{ inputs.host }}
      run: |
        python3 "${{ github.action_path }}/scripts/sitemap-urls.py" "${{ inputs.sitemap-url }}" > pages.txt
        N=$(grep -c . pages.txt || true)
        echo "Collected $N page URLs across the sitemap"
        [ "$N" -gt 0 ] || { echo "::error::sitemap expansion produced no URLs (sitemap down?)"; exit 1; }
        # `$N > 0` is the floor that 18-instead-of-1824 walked straight through.
        # Publish the count so the next step can judge it against this site's own
        # history — nothing inside one run can tell a small site from a truncated
        # one.
        echo "pages=$N" >> "$GITHUB_OUTPUT"

    # Decide BEFORE the crawl, so the decision is on the record even if the crawl
    # dies — and so the reason is in the log next to the page count it judged.
    # This step can only publish a token; it never fails the run. A floor script
    # that crashed has cost us the extra protection, not the crawl's verdict.
    - name: Judge the crawl size against this site's own history
      id: floor
      if: ${{ inputs.crawl-floor-fraction != '0' }}
      shell: bash
      run: |
        d=$(python3 "${{ github.action_path }}/scripts/crawl-floor.py" decide \
              --pages "${{ steps.sitemap.outputs.pages }}" \
              --baseline "${{ github.workspace }}/.linkcheck-baseline.json" \
              --fraction "${{ inputs.crawl-floor-fraction }}" \
              --min-history "${{ inputs.crawl-floor-min-history }}" 2>floor.err)
        cat floor.err
        # Fail CLOSED on an empty read, and note WHICH way "closed" points here:
        # towards not judging. An empty stdout means the script produced no token
        # at all, which is the one state that must never be silently defaulted to
        # `ok` — that would restore the exact bug, a guard reporting healthy
        # because it never ran.
        case "$d" in
          ok|collapsed|no-baseline|unreadable) : ;;
          *) d=unreadable
             echo "crawl-floor: no decision token was produced — treating as unjudged" ;;
        esac
        echo "decision=$d" >> "$GITHUB_OUTPUT"
        { echo "_crawl-floor: $d_"; cat floor.err; } >> "$GITHUB_STEP_SUMMARY"

    - name: Crawl + check every link & image
      id: crawl
      shell: bash
      env:
        LINKCHECK_HOST: ${{ inputs.host }}
        LINKCHECK_WORKERS: ${{ inputs.workers }}
        LINKCHECK_ALLOW: ${{ github.workspace }}/${{ inputs.allow-file }}
        VERIFY_HOMEPAGE_TOKEN: ${{ inputs.verify-token }}
        # Through `env:`, not `${{ }}` inline in the body, so selftest.py can
        # extract this run: block and execute it under the real bash flags with
        # the decision set directly. The 2026-09-04 bug shipped because the
        # assertions could only read the wiring, never run it.
        LINKCHECK_FLOOR_DECISION: ${{ steps.floor.outputs.decision }}
      # The crawl publishes a step OUTPUT so the issue steps below can tell a link
      # VERDICT from a tool FAULT — `failure()` cannot, and keying on it is what used
      # to file a false "broken links found" issue whenever our own crawler died.
      #
      # TWO BUGS LIVED HERE UNTIL 2026-09-04, and together they made this action CLOSE
      # its own broken-links issue on every run that FOUND broken links. Measured on
      # mvalasis/luxairportlu run 31351732755 and reproduced on lampakia-astro run
      # 33382684973: "Open / update" skipped, "Close … when clean" succeeded, "✓ Closed
      # issue #13". The issue had been open since 2026-07-27; four more red weekly runs
      # after it was closed opened nothing. That is why two fleet gates were red for
      # over a month with nobody seeing them.
      #
      #   1. `shell: bash` runs `bash --noprofile --norc -eo pipefail {0}`, so `-e` is
      #      ON. The crawl pipeline exits non-zero on a real finding, which aborted the
      #      step RIGHT THERE — before `rc=` was ever written. The old comment's claim
      #      that "the write happens BEFORE exit" was true of the source and false of
      #      the execution. The pipeline is now guarded with `set +e` so the status is
      #      captured instead of killing the shell.
      #   2. An unset output is NOT inert in a GitHub `if:`. Comparing null to a
      #      numeric-looking string coerces BOTH to numbers, so `outputs.rc == '0'`
      #      was TRUE whenever rc was missing — i.e. "we never got a verdict" read as
      #      "verified clean", the most dangerous possible default. The old comment
      #      asserted the opposite ("falls out of the comparison for free"), which is
      #      the assumption that shipped the bug.
      #
      # So the conditions below key on `verdict`, a NON-NUMERIC token. null cannot
      # coerce to 'clean' or 'broken', which makes the failure mode unreachable rather
      # than merely fixed — and it still holds for the two cases where no rc exists at
      # all: the crawler crashing (rc 2), and this step never running because sitemap
      # expansion failed.
      run: |
        set -o pipefail
        # Clear both side files FIRST. A stale linkcheck-review.txt from an earlier
        # invocation in the same job would be re-uploaded under the same artifact
        # name (upload-artifact@v4 rejects a duplicate name, so the second one 409s),
        # and a stale linkcheck-verdict.txt would let a SKIPPED crawl look like it
        # ran. The selftest's unset-verdict pass depends on that file's ABSENCE.
        rm -f linkcheck-review.txt linkcheck-verdict.txt
        set +e
        python3 "${{ github.action_path }}/scripts/linkcheck.py" - < pages.txt | tee linkcheck-report.txt
        rc=${PIPESTATUS[0]}
        set -e
        case "$rc" in
          0) verdict=clean ;;
          1) verdict=broken ;;
          *) verdict=fault ;;
        esac
        # A COLLAPSED PAGE SET INVALIDATES BOTH VERDICTS, and the clean one is the
        # dangerous half. lampakia-astro run 33382684973 crawled 18 of ~1824 pages
        # and reported `broken` with ten named URLs that all return 200 — a
        # confident claim about a site 99% of which was never fetched. Had those
        # 18 pages been link-clean it would have reported `clean` and CLOSED the
        # broken-links issue, which is the same defect pointing the other way and
        # far harder to notice. So this downgrades clean AND broken to `fault`:
        # "we could not look" is a third state, not a shade of "we looked".
        #
        # rc moves to 2 with it. The step must go red — a collapsed crawl that
        # exited 0 would report a green gate for a run that verified nothing — and
        # 2 is already this action's code for "no verdict", so the exit code and
        # the verdict token cannot disagree.
        if [ "${LINKCHECK_FLOOR_DECISION:-}" = "collapsed" ]; then
          {
            echo
            echo "=== CRAWL SIZE COLLAPSED — this is NOT a link verdict ==="
            echo "The page set was a fraction of this site's usual size, so the crawl"
            echo "covered a fraction of the site. The '$verdict' result below describes"
            echo "only the pages that were reached and says nothing about the rest."
            echo "Neither reported broken nor declared clean; the tracking issue is"
            echo "left exactly as it was."
            echo "Look at the sitemap first (a truncated or mid-deploy sitemap is the"
            echo "usual cause), not at the URLs listed above."
          } | tee -a linkcheck-report.txt
          verdict=fault
          rc=2
        fi
        { echo "rc=$rc"; echo "verdict=$verdict"; } >> "$GITHUB_OUTPUT"
        # The same verdict as a FILE, so a caller can assert the discriminator
        # directly. A composite's `outputs:` mapping is not readable by the caller
        # when the composite FAILED — which is precisely the broken and fault cases —
        # so the file is the only oracle available to the issue-lifecycle self-test.
        # Inert for real callers: one 7-byte file in the workspace.
        printf '%s\n' "$verdict" > linkcheck-verdict.txt
        { echo '## Weekly full-site link & image check'; echo; echo '```'; cat linkcheck-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"

    # Only a run we TRUST extends the history: a real verdict (the crawl ran to a
    # conclusion) on a page set the floor did not call collapsed. Recording a
    # collapsed run would drag the median down towards the truncated size and
    # disarm the floor after a few bad weeks — the guard quietly training itself
    # to accept the thing it exists to catch.
    - name: Record this crawl's size in the baseline
      if: ${{ !cancelled() && inputs.crawl-floor-fraction != '0'
              && steps.floor.outputs.decision != 'collapsed'
              && (steps.crawl.outputs.verdict == 'clean' || steps.crawl.outputs.verdict == 'broken') }}
      shell: bash
      run: |
        python3 "${{ github.action_path }}/scripts/crawl-floor.py" record \
          --pages "${{ steps.sitemap.outputs.pages }}" \
          --baseline "${{ github.workspace }}/.linkcheck-baseline.json"

    # continue-on-error: a cache write is a convenience, never a verdict. A cache
    # service blip, or a second linkcheck invocation in one job hitting the same
    # run-id key, must not turn a healthy gate red — the next run simply re-reads
    # the older entry, or none, and says so.
    - name: Save the crawl-size baseline
      continue-on-error: true
      if: ${{ !cancelled() && inputs.manage-baseline == 'true'
              && inputs.crawl-floor-fraction != '0'
              && steps.floor.outputs.decision != 'collapsed'
              && (steps.crawl.outputs.verdict == 'clean' || steps.crawl.outputs.verdict == 'broken') }}
      uses: actions/cache/save@v4
      with:
        path: .linkcheck-baseline.json
        key: linkcheck-baseline-v1-${{ inputs.host }}-${{ github.run_id }}

    - name: Upload the REVIEW queue (WAF-fronted URLs to verify out-of-band)
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: linkcheck-review
        path: linkcheck-review.txt
        if-no-files-found: ignore
        retention-days: 14

    # Issue lifecycle keys on the crawler's OWN verdict, never on `failure()`.
    #   broken → real broken links   → open/comment.
    #   clean  → verified clean      → close.
    #   fault  → the crawler crashed → do NEITHER. We did not check the links, so we
    #            can neither report them broken nor declare them clean; the step is
    #            already red and the crash detail is already in the step summary.
    #   unset  → the crawl step never ran (e.g. sitemap expansion failed) → also
    #            neither. This case needs a NON-NUMERIC token to work: an unset output
    #            compared against '0' coerces to 0 == 0 and reads as CLEAN. It did
    #            exactly that until 2026-09-04.
    - name: Open / update the broken-links issue
      if: ${{ !cancelled() && steps.crawl.outputs.verdict == 'broken' && inputs.manage-issue == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |
        TITLE="Weekly link check: broken links found"
        run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
        report="$(awk '/^=== link check/{p=1} p' linkcheck-report.txt 2>/dev/null)"
        [ -n "$report" ] || report="(report unavailable — open the run log)"
        body="$(printf 'The weekly full-site check found broken links on **%s**.\n\nRun: %s\n\nThis issue auto-closes when the next run is clean.\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%d)" "$run_url" "$report")"
        num="$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
        if [ -n "$num" ]; then
          gh issue comment "$num" -R "$REPO" --body "$body" && echo "Commented on issue #$num"
        else
          gh issue create -R "$REPO" --title "$TITLE" --body "$body"
        fi

    - name: Close the broken-links issue when clean
      if: ${{ !cancelled() && steps.crawl.outputs.verdict == 'clean' && inputs.manage-issue == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        TITLE="Weekly link check: broken links found"
        num="$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
        if [ -n "$num" ]; then
          gh issue comment "$num" -R "$REPO" --body "Resolved — the weekly full-site check is clean (0 broken) as of $(date -u +%Y-%m-%d)."
          gh issue close "$num" -R "$REPO" && echo "Closed issue #$num"
        fi
