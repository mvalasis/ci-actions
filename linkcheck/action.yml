name: 'Full-site link & image check'
description: >-
  Curl-based broken-link / image / outbound crawl of a WordPress site,
  driven by its Rank Math sitemap. A broken internal link/image or a dead
  outbound (404/410) fails the step; flaky externals are non-fatal. Can
  open and auto-close a GitHub issue with the broken-link report.

inputs:
  sitemap-url:
    description: 'Rank Math sitemap_index.xml URL to expand into the page list.'
    required: true
  host:
    description: 'Internal host. Links to this host + its subdomains are fatal if broken.'
    required: true
  verify-token:
    description: 'X-Verify-Source WAF-bypass token. Sent ONLY to the internal host.'
    required: false
    default: ''
  allow-file:
    description: 'Path (relative to the caller checkout) to a baselined-URL allow-list.'
    required: false
    default: 'scripts/linkcheck-allow.txt'
  workers:
    description: 'Concurrent curl workers.'
    required: false
    default: '10'
  manage-issue:
    description: 'Open/auto-close a GitHub issue on failure/clean. Needs `issues: write`.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Expand sitemap → page list
      shell: bash
      env:
        VERIFY_HOMEPAGE_TOKEN: ${{ inputs.verify-token }}
        # Same internal host the crawler uses, so the sitemap fetch scopes the
        # X-Verify-Source token to it (+ subdomains) and never carries it to a
        # cross-host child-sitemap or redirect target.
        LINKCHECK_HOST: ${{ inputs.host }}
      run: |
        python3 "${{ github.action_path }}/scripts/sitemap-urls.py" "${{ inputs.sitemap-url }}" > pages.txt
        N=$(grep -c . pages.txt || true)
        echo "Collected $N page URLs across the sitemap"
        [ "$N" -gt 0 ] || { echo "::error::sitemap expansion produced no URLs (sitemap down?)"; exit 1; }

    - name: Crawl + check every link & image
      id: crawl
      shell: bash
      env:
        LINKCHECK_HOST: ${{ inputs.host }}
        LINKCHECK_WORKERS: ${{ inputs.workers }}
        LINKCHECK_ALLOW: ${{ github.workspace }}/${{ inputs.allow-file }}
        VERIFY_HOMEPAGE_TOKEN: ${{ inputs.verify-token }}
      # The crawl publishes a step OUTPUT so the issue steps below can tell a link
      # VERDICT from a tool FAULT — `failure()` cannot, and keying on it is what used
      # to file a false "broken links found" issue whenever our own crawler died.
      #
      # TWO BUGS LIVED HERE UNTIL 2026-09-04, and together they made this action CLOSE
      # its own broken-links issue on every run that FOUND broken links. Measured on
      # mvalasis/luxairportlu run 31351732755 and reproduced on lampakia-astro run
      # 33382684973: "Open / update" skipped, "Close … when clean" succeeded, "✓ Closed
      # issue #13". The issue had been open since 2026-07-27; four more red weekly runs
      # after it was closed opened nothing. That is why two fleet gates were red for
      # over a month with nobody seeing them.
      #
      #   1. `shell: bash` runs `bash --noprofile --norc -eo pipefail {0}`, so `-e` is
      #      ON. The crawl pipeline exits non-zero on a real finding, which aborted the
      #      step RIGHT THERE — before `rc=` was ever written. The old comment's claim
      #      that "the write happens BEFORE exit" was true of the source and false of
      #      the execution. The pipeline is now guarded with `set +e` so the status is
      #      captured instead of killing the shell.
      #   2. An unset output is NOT inert in a GitHub `if:`. Comparing null to a
      #      numeric-looking string coerces BOTH to numbers, so `outputs.rc == '0'`
      #      was TRUE whenever rc was missing — i.e. "we never got a verdict" read as
      #      "verified clean", the most dangerous possible default. The old comment
      #      asserted the opposite ("falls out of the comparison for free"), which is
      #      the assumption that shipped the bug.
      #
      # So the conditions below key on `verdict`, a NON-NUMERIC token. null cannot
      # coerce to 'clean' or 'broken', which makes the failure mode unreachable rather
      # than merely fixed — and it still holds for the two cases where no rc exists at
      # all: the crawler crashing (rc 2), and this step never running because sitemap
      # expansion failed.
      run: |
        set -o pipefail
        set +e
        python3 "${{ github.action_path }}/scripts/linkcheck.py" - < pages.txt | tee linkcheck-report.txt
        rc=${PIPESTATUS[0]}
        set -e
        case "$rc" in
          0) verdict=clean ;;
          1) verdict=broken ;;
          *) verdict=fault ;;
        esac
        { echo "rc=$rc"; echo "verdict=$verdict"; } >> "$GITHUB_OUTPUT"
        { echo '## Weekly full-site link & image check'; echo; echo '```'; cat linkcheck-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"

    - name: Upload the REVIEW queue (WAF-fronted URLs to verify out-of-band)
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: linkcheck-review
        path: linkcheck-review.txt
        if-no-files-found: ignore
        retention-days: 14

    # Issue lifecycle keys on the crawler's OWN verdict, never on `failure()`.
    #   broken → real broken links   → open/comment.
    #   clean  → verified clean      → close.
    #   fault  → the crawler crashed → do NEITHER. We did not check the links, so we
    #            can neither report them broken nor declare them clean; the step is
    #            already red and the crash detail is already in the step summary.
    #   unset  → the crawl step never ran (e.g. sitemap expansion failed) → also
    #            neither. This case needs a NON-NUMERIC token to work: an unset output
    #            compared against '0' coerces to 0 == 0 and reads as CLEAN. It did
    #            exactly that until 2026-09-04.
    - name: Open / update the broken-links issue
      if: ${{ !cancelled() && steps.crawl.outputs.verdict == 'broken' && inputs.manage-issue == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RUN_ID: ${{ github.run_id }}
      run: |
        TITLE="Weekly link check: broken links found"
        run_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
        report="$(awk '/^=== link check/{p=1} p' linkcheck-report.txt 2>/dev/null)"
        [ -n "$report" ] || report="(report unavailable — open the run log)"
        body="$(printf 'The weekly full-site check found broken links on **%s**.\n\nRun: %s\n\nThis issue auto-closes when the next run is clean.\n\n```\n%s\n```\n' "$(date -u +%Y-%m-%d)" "$run_url" "$report")"
        num="$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
        if [ -n "$num" ]; then
          gh issue comment "$num" -R "$REPO" --body "$body" && echo "Commented on issue #$num"
        else
          gh issue create -R "$REPO" --title "$TITLE" --body "$body"
        fi

    - name: Close the broken-links issue when clean
      if: ${{ !cancelled() && steps.crawl.outputs.verdict == 'clean' && inputs.manage-issue == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        TITLE="Weekly link check: broken links found"
        num="$(gh issue list -R "$REPO" --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
        if [ -n "$num" ]; then
          gh issue comment "$num" -R "$REPO" --body "Resolved — the weekly full-site check is clean (0 broken) as of $(date -u +%Y-%m-%d)."
          gh issue close "$num" -R "$REPO" && echo "Closed issue #$num"
        fi
