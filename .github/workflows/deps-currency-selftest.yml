name: deps-currency self-test

# Offline regression guard (no network, no osv-scanner, no gh, no secrets): feeds a SAVED
# osv-scanner JSON fixture + workflow-text fixtures to the pure engine and asserts CVSS→bucket,
# severity-floor filtering, the issue open/close lifecycle, the fail-on-vuln block decision
# (report-mode-first), the unpinned-secret-consuming-action detection, and the spoof/disclosure
# guard. Deterministic — the action's own regression guard. A second job runs the REAL pinned
# osv-scanner (network: osv.dev) to prove the could-not-look classification against the binary.

on:
  push:
    branches: [main]
    # deps-currency installs osv-scanner through security-baseline's installer and pin.
    paths: ['deps-currency/**', '.github/workflows/deps-currency-selftest.yml', 'security-baseline/tool-pins.txt', 'security-baseline/scripts/install-pinned.sh']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  engine-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline engine self-test
        working-directory: deps-currency
        run: node scripts/selftest.mjs

  # The self-test's stub osv-scanner answers the way v2.4.0 was measured to. This job asks the REAL
  # binary, at action.yml's pin, the three questions the could-not-look classification (v1.19.4)
  # stakes on it: on this repository's lockfiles it looked; in an empty directory (its exit 128) it
  # looked at nothing and the sweep PASSes; with osv.dev unreachable it could not look, so the run is
  # no verdict — a FAULT under fail-on-vuln — never "PASS". Needs osv.dev: red during an osv.dev
  # outage is the check doing its job. Annotations and the step summary are off, and gh is never run.
  real-osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # action.yml's default, through the installer the action runs: a default that is not the pin
      # in security-baseline/tool-pins.txt has no digest, so this step fails.
      - name: Install osv-scanner (action.yml's pin, SHA-256 verified)
        run: |
          v="$(awk '/^  osv-version:/ { f = 1 } f && /default:/ { print $2; exit }' deps-currency/action.yml | tr -d "'\"")"
          [ -n "$v" ] || { echo "::error::could not read osv-version's default from deps-currency/action.yml"; exit 1; }
          PIN_VERSION="$v" bash security-baseline/scripts/install-pinned.sh osv-scanner
          osv-scanner --version
      - name: Looked, looked at nothing, could not look
        run: |
          set +e
          fail=0
          bad() { echo "::error title=deps-currency real osv-scanner::$1"; fail=1; }
          scan() { env GITHUB_ACTIONS= GITHUB_STEP_SUMMARY= MANAGE_ISSUE=false "$@" node deps-currency/scripts/scan.mjs; }
          out="$(scan WORKING_DIRECTORY=.)"; rc=$?; printf '%s\n\n' "$out"
          case "$out" in *'could not look'*) bad 'this repository: the real osv-scanner could not look' ;; esac
          [ "$rc" = 0 ] || bad "this repository: exit $rc in report mode"
          mkdir -p "$RUNNER_TEMP/empty"
          out="$(scan WORKING_DIRECTORY="$RUNNER_TEMP/empty" FAIL_ON_VULN=true)"; rc=$?; printf '%s\n\n' "$out"
          case "$out" in *'PASS — no dependency advisories'*) ;; *) bad 'an empty directory, osv exit 128: no PASS' ;; esac
          case "$out" in *'could not look'*) bad 'an empty directory, osv exit 128: read as could-not-look' ;; esac
          [ "$rc" = 0 ] || bad "an empty directory under fail-on-vuln: exit $rc"
          out="$(scan WORKING_DIRECTORY=. FAIL_ON_VULN=true HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9)"; rc=$?; printf '%s\n\n' "$out"
          case "$out" in *'osv-scanner could not look — '*) ;; *) bad 'osv.dev unreachable: no could-not-look note' ;; esac
          case "$out" in *'FAULT — osv-scanner could not look'*) ;; *) bad 'osv.dev unreachable under fail-on-vuln: no FAULT verdict' ;; esac
          case "$out" in *'PASS —'*) bad 'osv.dev unreachable: PASS' ;; esac
          [ "$rc" = 1 ] || bad "osv.dev unreachable under fail-on-vuln: exit $rc, want 1"
          # Exit 128 beside a lockfile (v1.19.5) rests on osv's stderr wording: `Error during extraction`
          # for a lockfile it cannot parse, `Scanned … and found N packages` for one it read. These three
          # trees pin that wording, for both actions, on every osv-version bump.
          lock() { mkdir -p "$RUNNER_TEMP/$1"; printf '%s' "$3" > "$RUNNER_TEMP/$1/$2"; }
          lock truncated package-lock.json '{"name":"x","lockfileVersion":3,"packages":{"node_modules/lodash":{"version":"4.17'
          lock no-dependency package-lock.json '{"name":"x","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"x","version":"1.0.0"}}}'
          lock lockb-only bun.lockb "$(printf 'bun-lockfile-format-v0 binary')"
          out="$(scan WORKING_DIRECTORY="$RUNNER_TEMP/truncated" FAIL_ON_VULN=true)"; rc=$?; printf '%s\n\n' "$out"
          case "$out" in *'osv-scanner could not look — exit 128: Error during extraction: '*'package-lock.json: could not extract'*) ;; *) bad 'a truncated package-lock.json: no could-not-look note naming the extraction error' ;; esac
          [ "$rc" = 1 ] || bad "a truncated package-lock.json under fail-on-vuln: exit $rc, want 1"
          out="$(scan WORKING_DIRECTORY="$RUNNER_TEMP/no-dependency" FAIL_ON_VULN=true)"; rc=$?; printf '%s\n\n' "$out"
          case "$out" in *'PASS — no dependency advisories'*) ;; *) bad 'a valid package-lock.json with no dependency: no PASS' ;; esac
          [ "$rc" = 0 ] || bad "a valid package-lock.json with no dependency under fail-on-vuln: exit $rc"
          out="$(scan WORKING_DIRECTORY="$RUNNER_TEMP/lockb-only" FAIL_ON_VULN=true)"; rc=$?; printf '%s\n\n' "$out"
          case "$out" in *"osv-scanner could not look — exit 128: it read none of the tree's lockfiles: bun.lockb"*) ;; *) bad 'a bun.lockb alone: no could-not-look note naming it' ;; esac
          [ "$rc" = 1 ] || bad "a bun.lockb alone under fail-on-vuln: exit $rc, want 1"
          exit "$fail"

  # The action's own install step, end to end (v1.21.0). It runs security-baseline's installer from
  # the sibling directory: the positive run proves that path resolves and the pin installs through
  # action.yml, so the negative run's failure can only be the digest's. Neither run opens an issue
  # (manage-issue: false; the token is read-only anyway).
  install-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Precondition — no osv-scanner on this runner yet
        shell: bash
        run: |
          if command -v osv-scanner; then
            echo "::error title=deps-currency self-test::the runner image already has osv-scanner, so the checks below cannot tell what the action installed"
            exit 1
          fi
      # 8.30.0's gitleaks digest given for osv-scanner: well-formed, published, and wrong.
      - name: A wrong osv-sha256 fails the action (expected to fail)
        id: wrong-digest
        continue-on-error: true
        uses: ./deps-currency
        with:
          osv-sha256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
          manage-issue: 'false'
      - name: The wrong digest failed the action and installed nothing
        shell: bash
        env:
          OUTCOME: ${{ steps.wrong-digest.outcome }}
        run: |
          fail=0
          [ "$OUTCOME" = failure ] || { echo "::error title=deps-currency self-test::a wrong osv-sha256 left the action's outcome '$OUTCOME', not failure"; fail=1; }
          if command -v osv-scanner; then echo "::error title=deps-currency self-test::osv-scanner was installed despite a wrong digest"; fail=1; fi
          exit "$fail"
      - name: The pin installs through action.yml (report mode)
        id: pinned
        uses: ./deps-currency
        with:
          manage-issue: 'false'
      - name: The pinned osv-scanner is the one installed
        shell: bash
        run: |
          want="$(awk '$1 == "osv-scanner" { print $3 }' security-baseline/tool-pins.txt)"
          got="$(sha256sum "$(command -v osv-scanner)" | cut -d' ' -f1)"
          [ -n "$want" ] && [ "$got" = "$want" ] || { echo "::error title=deps-currency self-test::the installed osv-scanner hashes to $got, not the pin ${want:-?}"; exit 1; }
