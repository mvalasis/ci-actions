name: linkcheck engine self-test

# Two guards, and the split is the point.
#
# engine-selftest  — offline, no writes. Token scoping across a redirect chain, plus the
#                    static verdict-token class checks added 2026-09-04.
# issue-lifecycle  — the LIVE half. Runs the real composite against a loopback site and
#                    lets GitHub's OWN `if:` evaluator decide the issue steps.
#
# WHY THE SECOND ONE EXISTS. On 2026-09-04 this action was found CLOSING its own
# broken-links issue on every run that FOUND broken links; two fleet gates sat red for
# over a month because the notification path was inverted. Two bugs had to combine:
# `shell: bash` runs with -e so the crawl aborted before writing `rc=`, and an UNSET
# Actions output compared to a numeric literal coerces both to numbers, so
# `outputs.rc == '0'` was TRUE when rc was missing — "we never got a verdict" evaluated
# as "verified clean". What let it ship was that the selftest PINNED THE BUGGY CONDITION
# VERBATIM. A static check proves a condition EXISTS, never that it FIRES; `if:` is
# evaluated server-side, so no amount of local Python can grade it.
#
# THE FOUR PASSES ARE THE WHOLE DESIGN — one per branch of the verdict contract:
#   broken → OPEN the issue        clean  → CLOSE it
#   fault  → do NEITHER            unset  → do NEITHER   ← the regression's real mechanism
#   collapsed → do NEITHER, even though the links came back clean (added 2026-09-06)
#
# THE COLLAPSED PASS (3b) IS AN A/B AGAINST PASS 4. Both crawl the same one-page
# clean fixture; only the baseline file differs. So a broken floor does not make 3b
# fail quietly — it makes 3b CLOSE the issue, which is the exact production defect:
# lampakia-astro run 33382684973 fetched 18 of ~1824 pages and published a verdict
# about the whole site. It reported `broken` that day; had the 18 been clean it
# would have closed the tracking issue and declared the site verified.
# The `unset` pass is the load-bearing one, and this is MEASURED, not argued. Run
# 33911783576 dispatched this job against a branch carrying exactly that partial relapse
# (numeric `rc == '0'`/`'1'` conditions restored, `set +e` kept). Result: BROKEN, FAULT
# and their assertions all PASSED, and the job failed on one step —
#   "AN UNSET VERDICT CLOSED #5 ... a null output compared to a numeric literal coerces
#    to 0 == 0, so 'we never checked' read as 'verified clean'."
# Delete the unset pass and the guard goes green on the regression it exists to catch.
#
# COST, stated plainly: one real issue is opened and closed on THIS repo per run, left
# closed with a comment marking it a fixture artifact. `gh issue create` IS the code
# under test, so there is no read-only equivalent. It is confined to this repo (never a
# caller), reversible, and fires only on changes to linkcheck/** or manual dispatch —
# a handful of times a year.
#
# SEQUENCING: `v1` must not be force-moved onto a commit until this job is green on it.
# This is a post-merge guard, so it cannot block the push that breaks it — the release
# ritual is what keeps a broken lifecycle out of the 6 callers.

on:
  push:
    branches: [main]
    paths:
      - 'linkcheck/**'
      - '.github/workflows/linkcheck-selftest.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  engine-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Offline token-scoping self-test
        run: python3 linkcheck/scripts/selftest.py

  issue-lifecycle:
    name: issue lifecycle (live — broken opens; fault/unset do nothing; clean closes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Title-keyed state on a shared repo: two overlapping runs would fight over ONE
    # issue and cross-close it, reporting the exact regression under guard as a
    # failure. Never cancel-in-progress — a run killed mid-lifecycle leaks its issue.
    concurrency:
      group: linkcheck-issue-lifecycle
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    env:
      TITLE: 'Weekly link check: broken links found'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Fixtures must be in the checkout
        run: |
          [ -d linkcheck/fixtures/site ] || {
            echo "::error::fixture site missing — were linkcheck/fixtures/** committed?"; exit 1; }

      - name: Serve the fixture site on loopback
        run: |
          cd linkcheck/fixtures/site
          nohup python3 -m http.server 8099 --bind 127.0.0.1 >/tmp/fixture-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:8099/ok.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8099/ok.html || {
            echo "::error::fixture server never came up"; cat /tmp/fixture-server.log; exit 1; }

      # LOAD-BEARING, not informational. A leftover open issue would make "the broken
      # pass opened an issue" pass vacuously, so the job refuses to start ambiguous.
      # The always() cleanup below makes leftovers unlikely; when one happens it is a
      # real signal, not noise.
      - name: Precondition — no open fixture issue
        run: |
          raw=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                  --jq ".[] | select(.title==\"$TITLE\") | .number") \
            || { echo "::error::INFRA — could not list issues; this is not a linkcheck verdict"; exit 1; }
          if [ -n "$raw" ]; then
            echo "::error::an issue titled '$TITLE' is ALREADY open (#$(echo "$raw" | tr '\n' ' ')). Every assertion below would be ambiguous. Close it, then re-run: gh issue close <n> -R $GITHUB_REPOSITORY"
            exit 1
          fi
          # Sentinel: the cleanup step keys on this, NOT on the issue number, so a
          # failure between "issue created" and "number recorded" cannot leak it.
          echo "LIFECYCLE=1" >> "$GITHUB_ENV"
          echo "STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      # ---- 1. BROKEN → the issue must be OPENED ---------------------------------
      - name: 'BROKEN pass (verdict=broken)'
        id: broken
        continue-on-error: true      # the crawl exits 1 by design; the composite's issue
        uses: ./linkcheck            # steps are `if: !cancelled()` and still run
        with:
          sitemap-url: 'http://127.0.0.1:8099/sitemap_index.xml'
          host: '127.0.0.1'
          workers: '4'
          manage-issue: 'true'

      - name: Assert the crawl classified it BROKEN
        run: |
          [ "${{ steps.broken.outcome }}" = "failure" ] \
            || { echo "::error::the broken fixture stopped failing the crawl — everything below would pass vacuously"; exit 1; }
          v=$(cat linkcheck-verdict.txt 2>/dev/null || true)
          [ "$v" = "broken" ] || { echo "::error::expected verdict=broken, got '$v' — a positive oracle, not a side-effect proxy"; exit 1; }

      # REST list, not search: the search index lags a just-created issue, and this
      # assertion must grade the ACTION, never GitHub's indexing latency.
      # POLL, never a single read. Measured on run 33911430879: the composite created
      # the issue at T+0 and this endpoint still returned an empty list ~300ms later,
      # so a one-shot read turned "GitHub has not caught up" into
      # "THE REGRESSION IS BACK" — a failed probe used as a verdict, which is the
      # exact class this job polices, reproduced inside the job. The REST list is
      # read-after-write EVENTUALLY consistent; only its absence after a bounded wait
      # means anything.
      - name: Assert an issue was OPENED, and by THIS run
        run: |
          num=''
          for _ in $(seq 1 30); do
            raw=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                    --jq ".[] | select(.title==\"$TITLE\") | .number") \
              || { echo "::error::INFRA — issue list failed; cannot conclude anything"; exit 1; }
            num=$(printf '%s\n' "$raw" | head -1)
            case "$num" in ''|*[!0-9]*) ;; *) break ;; esac
            sleep 2
          done
          case "$num" in
            ''|*[!0-9]*) echo "::error::verdict=broken did NOT open an issue within 60s — THE REGRESSION THIS JOB EXISTS FOR IS BACK"; exit 1 ;;
          esac
          created=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq '.created_at') \
            || { echo "::error::INFRA — could not read issue #$num"; exit 1; }
          # Newer than this job's own start: a leftover from a re-run ATTEMPT of the
          # same run shares $GITHUB_RUN_ID, so the run-id alone is not proof.
          [ "$(date -u -d "$created" +%s 2>/dev/null || date -u -jf '%Y-%m-%dT%H:%M:%SZ' "$created" +%s)" -ge "$STARTED_AT" ] \
            || { echo "::error::#$num predates this job — a leftover, not proof"; exit 1; }
          echo "ISSUE=$num" >> "$GITHUB_ENV"
          echo "✓ issue #$num opened by this run"

      # The action's own close step finds the issue via `gh issue list --search`, which
      # is index-backed. Wait for consistency HERE, so a lag can never be misread below
      # as "the clean branch failed to fire".
      - name: Wait for the search index (the action's own lookup path)
        run: |
          for _ in $(seq 1 75); do
            n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" \
                  --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" 2>/dev/null | head -1) || true
            [ -n "$n" ] && { echo "✓ searchable as #$n"; exit 0; }
            sleep 4
          done
          echo "::error::INFRA — GitHub's issue search index did not see #$ISSUE within 300s. This is NOT a linkcheck regression: the action's close step is index-backed and could not have found it either. Re-run."
          exit 1

      # ---- 2. FAULT → the issue must be left ALONE ------------------------------
      # An empty host makes linkcheck.py exit 2 (it refuses to classify internal vs
      # external without one) ⇒ verdict=fault. That is the CONFIG-error route to rc=2;
      # the crash route reaches the same branch via the script's own crash guard.
      # Either way: we did not check the links, so we may neither report them broken
      # nor declare them clean.
      - name: Snapshot the issue before the FAULT pass
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq 'length') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          echo "COMMENTS_BEFORE=$n" >> "$GITHUB_ENV"
          rm -f linkcheck-verdict.txt

      - name: 'FAULT pass (verdict=fault)'
        id: fault
        continue-on-error: true
        uses: ./linkcheck
        with:
          sitemap-url: 'http://127.0.0.1:8099/sitemap_index_clean.xml'
          host: ''
          workers: '4'
          manage-issue: 'true'

      - name: Assert a FAULT wrote NOTHING (both directions)
        run: |
          v=$(cat linkcheck-verdict.txt 2>/dev/null || true)
          [ "$v" = "fault" ] || { echo "::error::expected verdict=fault, got '$v'"; exit 1; }
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .state) \
            || { echo "::error::INFRA — state probe failed"; exit 1; }
          [ "$state" = "open" ] || { echo "::error::a crawler FAULT closed #$ISSUE — 'we could not look' was treated as 'verified clean'"; exit 1; }
          after=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq 'length') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          # Two-sided: absence of 'Resolved' alone would let a fault→BROKEN misroute
          # (a false "broken links found" report about links we never checked) pass.
          [ "$after" = "$COMMENTS_BEFORE" ] \
            || { echo "::error::a crawler FAULT wrote to #$ISSUE ($COMMENTS_BEFORE→$after comments) — fault must do NEITHER"; exit 1; }
          echo "✓ fault left #$ISSUE open and untouched"

      # ---- 3. UNSET → the issue must be left ALONE ------------------------------
      # THE LOAD-BEARING PASS. A bogus sitemap makes expansion yield zero URLs, so
      # action.yml's `[ "$N" -gt 0 ]` aborts the composite and the crawl step NEVER
      # RUNS — `steps.crawl.outputs.verdict` is genuinely null. This is the state that
      # produced the incident, and the only pass that goes red on a numeric-coercion
      # relapse. Its oracle is the ABSENCE of linkcheck-verdict.txt, which the crawl
      # step deletes on entry and writes on exit.
      - name: Snapshot the issue before the UNSET pass
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq 'length') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          echo "COMMENTS_BEFORE=$n" >> "$GITHUB_ENV"
          rm -f linkcheck-verdict.txt

      - name: 'UNSET pass (crawl step never runs — outputs are null)'
        id: unset
        continue-on-error: true
        uses: ./linkcheck
        with:
          sitemap-url: 'http://127.0.0.1:8099/no-such-sitemap.xml'
          host: '127.0.0.1'
          workers: '4'
          manage-issue: 'true'

      - name: Assert an UNSET verdict wrote NOTHING
        run: |
          [ ! -f linkcheck-verdict.txt ] \
            || { echo "::error::the crawl step RAN ('$(cat linkcheck-verdict.txt)') — this pass must skip it, or it proves nothing about a null output"; exit 1; }
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .state) \
            || { echo "::error::INFRA — state probe failed"; exit 1; }
          [ "$state" = "open" ] \
            || { echo "::error::AN UNSET VERDICT CLOSED #$ISSUE. This is the 2026-09-04 regression exactly: a null output compared to a numeric literal coerces to 0 == 0, so 'we never checked' read as 'verified clean'."; exit 1; }
          after=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq 'length') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          [ "$after" = "$COMMENTS_BEFORE" ] \
            || { echo "::error::an UNSET verdict wrote to #$ISSUE ($COMMENTS_BEFORE→$after) — it must do NEITHER"; exit 1; }
          echo "✓ unset verdict left #$ISSUE open and untouched"

      # ---- 3b. COLLAPSED → the issue must be left ALONE -------------------------
      # THE A/B PASS, and it is deliberately the same fixture as pass 4 below. Both
      # crawl `sitemap_index_clean.xml`, one page, zero broken links. The ONLY
      # difference is the baseline file this step writes first — so if the floor is
      # not working, this pass does what pass 4 does: CLOSES the issue.
      #
      # That is the dangerous direction of the 2026-09-06 lampakia-astro class. Run
      # 33382684973 crawled 18 of ~1824 pages and reported `broken`, naming ten URLs
      # that all return 200. Had those 18 pages been link-clean it would have
      # reported `clean` and closed the tracking issue, declaring a site verified
      # when 99% of it was never fetched — the same defect, quieter, and nothing
      # downstream could tell.
      #
      # `manage-baseline: false` so the composite reads the file written here and
      # skips the Actions cache: this pass grades the DECISION and the issue
      # lifecycle, not the cache plumbing.
      - name: Snapshot the issue before the COLLAPSED pass
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq 'length') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          echo "COMMENTS_BEFORE=$n" >> "$GITHUB_ENV"
          rm -f linkcheck-verdict.txt
          # 3 samples clears --min-history; 1 page against a median of 100 is 0.01x,
          # far below the 0.5 floor. Written here rather than accumulated so the pass
          # cannot silently disarm itself if the defaults change.
          echo '[100,100,100]' > .linkcheck-baseline.json

      - name: 'COLLAPSED pass (clean links, but 1 page against a median of 100)'
        id: collapsed
        continue-on-error: true
        uses: ./linkcheck
        with:
          sitemap-url: 'http://127.0.0.1:8099/sitemap_index_clean.xml'
          host: '127.0.0.1'
          workers: '4'
          manage-issue: 'true'
          manage-baseline: 'false'

      - name: Assert a COLLAPSED crawl wrote NOTHING, and did not close the issue
        run: |
          v=$(cat linkcheck-verdict.txt 2>/dev/null || true)
          [ "$v" = "fault" ] \
            || { echo "::error::expected verdict=fault from a collapsed crawl, got '$v'. With '$v' this pass is graded on the same path as the CLEAN pass below — which CLOSES the issue."; exit 1; }
          # Positive oracle: prove the crawl actually RAN and was clean, so the fault
          # came from the floor and not from the crawl failing for some other reason.
          grep -q 'CRAWL SIZE COLLAPSED' linkcheck-report.txt \
            || { echo "::error::the report does not name the collapse — the fault came from somewhere else and this pass proves nothing"; exit 1; }
          [ "${{ steps.collapsed.outcome }}" = "failure" ] \
            || { echo "::error::a collapsed crawl exited 0 — a green gate for a run that verified nothing"; exit 1; }
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .state) \
            || { echo "::error::INFRA — state probe failed"; exit 1; }
          [ "$state" = "open" ] \
            || { echo "::error::A COLLAPSED CRAWL CLOSED #$ISSUE. One page of a hundred was fetched and the action declared the site verified — 'we could not look' read as 'we looked and it is clean'."; exit 1; }
          after=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq 'length') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          [ "$after" = "$COMMENTS_BEFORE" ] \
            || { echo "::error::a collapsed crawl wrote to #$ISSUE ($COMMENTS_BEFORE→$after) — it must do NEITHER"; exit 1; }
          echo "✓ collapsed crawl left #$ISSUE open and untouched"
          # Pass 4 must run WITHOUT a baseline, or it collapses too and never closes.
          rm -f .linkcheck-baseline.json

      # ---- 4. CLEAN → the issue must be CLOSED ----------------------------------
      # Same sitemap as 3b, no baseline: the floor is unarmed, the crawl is clean,
      # and the issue closes. 3b and 4 together are the asymmetry — without 4 the
      # floor could fault everything and 3b would still pass.
      - name: 'CLEAN pass (verdict=clean)'
        id: clean
        uses: ./linkcheck
        with:
          sitemap-url: 'http://127.0.0.1:8099/sitemap_index_clean.xml'
          host: '127.0.0.1'
          workers: '4'
          manage-issue: 'true'

      - name: Assert the issue was CLOSED
        run: |
          v=$(cat linkcheck-verdict.txt 2>/dev/null || true)
          [ "$v" = "clean" ] || { echo "::error::expected verdict=clean, got '$v'"; exit 1; }
          state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .state) \
            || { echo "::error::INFRA — state probe failed"; exit 1; }
          [ "$state" = "closed" ] || { echo "::error::verdict=clean did NOT close #$ISSUE (state=$state)"; exit 1; }
          comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" --jq '.[].body') \
            || { echo "::error::INFRA — comment probe failed"; exit 1; }
          printf '%s' "$comments" | grep -qF 'Resolved' \
            || { echo "::error::#$ISSUE closed without the resolved-clean comment"; exit 1; }
          echo "✓ issue #$ISSUE closed by the clean pass"

      # Always: never leave an issue OPEN on a public repo because an assertion failed.
      # Keyed on the SENTINEL and re-derived BY TITLE, so it still fires when the run
      # died before $ISSUE was recorded — the window in which an issue exists but its
      # number does not. Confirms the end state rather than assuming it.
      - name: Leave nothing open
        if: ${{ always() && env.LIFECYCLE == '1' }}
        run: |
          set +e
          # Same read-after-write trap as the assertion above, and here it is worse:
          # a single lagged read printed "no fixture issue left open" on run
          # 33911430879 while the issue was open on a PUBLIC repo. Retry, and always
          # act on $ISSUE when we have it.
          nums=''
          for _ in $(seq 1 15); do
            nums=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                     --jq ".[] | select(.title==\"$TITLE\") | .number" 2>/dev/null)
            [ -n "$nums" ] && break
            sleep 2
          done
          if [ -n "$ISSUE" ]; then
            printf '%s\n' "$nums" | grep -qx "$ISSUE" || nums="$(printf '%s\n%s' "$nums" "$ISSUE")"
          fi
          nums=$(printf '%s\n' "$nums" | grep -E '^[0-9]+$' | sort -u)
          for n in $nums; do
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body \
              "Fixture artifact — opened and closed by the \`linkcheck\` issue-lifecycle self-test (run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Not a real finding: the links came from a loopback fixture in \`linkcheck/fixtures/site\`. This job exists because a static check pinned the buggy condition verbatim while the action spent weeks closing its own issue on every red run."
            gh issue close "$n" -R "$GITHUB_REPOSITORY"
          done
          # CONFIRM, with retries, and re-close rather than just reporting. On the
          # mutation run (33911783576) a single re-read said "#5 still OPEN" ~4s
          # after it had been closed — the same read-after-write flap as above, in
          # the direction that cries wolf. The dangerous direction is the other one
          # (reading `closed` while it is open, and silently leaking), so this
          # settles only on a stable answer and acts again if it sees `open`.
          leftover=''
          for _ in $(seq 1 6); do
            leftover=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                         --jq ".[] | select(.title==\"$TITLE\") | .number" 2>/dev/null)
            if [ -n "$ISSUE" ]; then
              st=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq .state 2>/dev/null)
              [ "$st" = "open" ] && leftover="$(printf '%s\n%s' "$leftover" "$ISSUE")"
            fi
            leftover=$(printf '%s\n' "$leftover" | grep -E '^[0-9]+$' | sort -u)
            [ -z "$leftover" ] && break
            for n in $leftover; do gh issue close "$n" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; done
            sleep 3
          done
          if [ -n "$leftover" ]; then
            echo "::error::fixture issue(s) #$(printf '%s' "$leftover" | tr '\n' ' ') still OPEN on a public repo after 6 attempts — close by hand: gh issue close <n> -R $GITHUB_REPOSITORY"
            exit 1
          fi
          echo "✓ no fixture issue left open"
