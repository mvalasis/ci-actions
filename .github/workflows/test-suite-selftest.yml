name: test-suite self-test

# Offline regression guard (no network, no real test-runner install): the pure core
# (stack detection, command resolution, runner-aware count parsing, exit-code-authoritative
# verdict, the "no tests = green" floor) PLUS end-to-end runs of run.mjs over committed node
# fixtures whose `test` script is a self-contained Node stub emitting real vitest-shaped output —
# proving the action detects RED, reports GREEN, and never blocks a repo with no tests. Plus a
# report-mode self-run smoke so a syntax/wiring break in run.mjs is caught.

on:
  push:
    branches: [main]
    paths: ['test-suite/**', '.github/workflows/test-suite-selftest.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  engine-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline self-test (core + E2E fixtures)
        working-directory: test-suite
        run: node scripts/selftest.mjs

  self-run-smoke:
    runs-on: ubuntu-latest
    needs: [engine-selftest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # report-mode self-run against ci-actions itself (no root package.json/composer.json) —
      # proves the full action wires up and reports a green "no stack to test", never blocking.
      - uses: ./test-suite
        with:
          working-directory: .
          fail-on-fail: 'false'

  # isolate-files through the REAL action.yml wiring. The offline legs set ISOLATE_FILES /
  # FAIL_ON_ISOLATION directly, so a typo in action.yml's env mapping would switch the feature off
  # without one of them noticing, and a caller would read green over a file that fails alone. On the
  # same fixture: blocking with the inputs on, green with them unset — and green with them on once
  # the fixture's file no longer fails alone, so the block is the check and not a crash (a crash
  # fails both).
  isolate-files-wiring:
    runs-on: ubuntu-latest
    needs: [engine-selftest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: ./test-suite
        id: on
        continue-on-error: true
        with:
          working-directory: test-suite/scripts/selftest/php-isolation
          stack: php
          test-command: node phpunit-stub.mjs
          fail-on-fail: 'true'
          isolate-files: 'true'
          fail-on-isolation: 'true'
      - uses: ./test-suite
        id: off
        continue-on-error: true
        with:
          working-directory: test-suite/scripts/selftest/php-isolation
          stack: php
          test-command: node phpunit-stub.mjs
          fail-on-fail: 'true'
      - name: Fix the fixture — its file no longer fails alone
        run: sed -i 's/fails-alone/passes-alone/' test-suite/scripts/selftest/php-isolation/tests/BorrowedHarnessTest.php
      - uses: ./test-suite
        id: fixed
        continue-on-error: true
        with:
          working-directory: test-suite/scripts/selftest/php-isolation
          stack: php
          test-command: node phpunit-stub.mjs
          fail-on-fail: 'true'
          isolate-files: 'true'
          fail-on-isolation: 'true'
      - name: isolate-files blocked on the file that fails alone, and only on it
        env:
          ON: ${{ steps.on.outcome }}
          OFF: ${{ steps.off.outcome }}
          FIXED: ${{ steps.fixed.outcome }}
        run: |
          echo "on: $ON (want failure) · off: $OFF (want success) · fixed: $FIXED (want success)"
          test "$ON" = failure && test "$OFF" = success && test "$FIXED" = success
