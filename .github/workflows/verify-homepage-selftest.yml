name: verify-homepage self-test

# Two layers, mirroring the other actions' self-tests:
#
# (1) fixture-selftest — the real regression guard. Runs render-check.mjs against
#     committed `file://` HTML fixtures: no network, no live site, but a real
#     Chromium, because overflow/collapse/overlap only exist after layout. It
#     pins the landmark-RESOLUTION diagnostics (v1.8.0): an ambiguous selector
#     must name the element it resolved to, the display:none ancestor that caused
#     a 0-height rect, and the runner-up match. A live site cannot hold this
#     down — lampakia had the exact defect for a month and then fixed it
#     (e2ff769), so the smoke run below can never exercise the path again.
#
# (2) live-smoke — the action in REPORT mode (fail-on-structure forced off, so
#     this can never block ci-actions itself). Proves npm ci + Chromium install +
#     the composite action wire up end-to-end against a real page. ci-actions
#     carries no scripts/verify-nav.json, so it also exercises the
#     nav-file-missing skip path. Dispatch to point it at any site.
#
# (3) links-retired — `checks: links` was retired in v1.15.0; a caller that
#     still asks for it must FAIL the step, never silently get no crawl. Needs
#     no browser (render/nav are not in checks), so it costs seconds.

on:
  push:
    branches: [main]
    paths: ['verify-homepage/**', '.github/workflows/verify-homepage-selftest.yml']
  workflow_dispatch:
    inputs:
      urls:
        description: 'Live URLs to render (space/newline-separated)'
        required: false
        default: 'https://www.lampakia.gr/'
      checks:
        description: 'Any subset of: render,nav'
        required: false
        default: 'render,nav'

permissions:
  contents: read

jobs:
  fixture-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Fixture self-test (offline, real Chromium)
        working-directory: verify-homepage
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node scripts/selftest.mjs

  live-smoke:
    runs-on: ubuntu-24.04
    needs: fixture-selftest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: ./verify-homepage
        with:
          urls: ${{ inputs.urls || 'https://www.lampakia.gr/' }}
          checks: ${{ inputs.checks || 'render,nav' }}
          fail-on-structure: 'false'
          verify-token: ${{ secrets.VERIFY_HOMEPAGE_TOKEN }}
          max-urls: '4'

  links-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - id: links
        uses: ./verify-homepage
        continue-on-error: true   # the failure IS the assertion; the next step grades it
        with:
          urls: 'https://www.lampakia.gr/'
          checks: 'links'
      - name: checks=links must fail the step
        env:
          OUTCOME: ${{ steps.links.outcome }}
        run: |
          echo "checks: links -> $OUTCOME"
          [ "$OUTCOME" = failure ] || { echo "::error::checks: links did not fail — the retired tier must fail loud"; exit 1; }
