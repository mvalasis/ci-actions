name: form-protection self-test

# Two layers: (1) the offline self-test (engine fixtures + a LOCAL http server
# exercising the real CLI probe path — deterministic, no external network; the
# real regression guard); (2) a live report-mode smoke run of the action against
# a chosen form page. fail-on-critical is forced off so this can never block
# ci-actions itself. The live smoke fires two minimal POSTs (tokenless +
# junk-token) at the target's submit endpoint — read-safe: a gated endpoint
# rejects before any side-effect, and the probe body carries no form fields.

on:
  push:
    branches: [main]
    paths: ['form-protection/**', '.github/workflows/form-protection-selftest.yml']
  workflow_dispatch:
    inputs:
      urls:
        description: 'Form page URLs for the live smoke run'
        required: false
        default: 'https://www.epn.one/contact/ https://www.epn.one/employers/'
      form-endpoints:
        description: 'selector => endpoint [mode=json] [token=…] [expect=…] map'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  engine-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline self-test (engine fixtures + local-server e2e)
        working-directory: form-protection
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/selftest.mjs

  live-smoke:
    runs-on: ubuntu-latest
    needs: engine-selftest
    steps:
      - uses: actions/checkout@v6
      - uses: ./form-protection
        with:
          urls: ${{ inputs.urls || 'https://www.epn.one/contact/ https://www.epn.one/employers/' }}
          form-endpoints: ${{ inputs.form-endpoints || '[data-epn-form] => /api/contact expect=turnstile_failed' }}
          fail-on-critical: 'false'
          verify-token: ${{ secrets.VERIFY_HOMEPAGE_TOKEN }}
          max-urls: '5'
