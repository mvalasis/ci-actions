name: security-baseline self-test

# Two offline regression guards (no network, no secrets): (1) the pure tier-engine self-test
# (block-by-default, never-newly-block, promotion, redaction); (2) the vendored semgrep rule
# packs via `semgrep --test` (each bad fixture fires, each good fixture stays silent). Plus a
# report-mode self-scan smoke so a syntax/wiring break in scan.mjs is caught, a pass of the
# real scanners that fails when any leg could not look (a FAULT a green smoke would hide), and the
# shapes this repo's own pushes never produce scanned with the real trufflehog and gitleaks: a
# pull_request checkout, a PR that merged its base in, a push of a merge (every walk must reach every
# commit of the range and none of the base's), gitleaks' range past a clock skew (a key the base
# already holds must warn, never block), and merges that add lines of their own (each key a merge
# adds must be read, and none its base held).

on:
  push:
    branches: [main]
    paths: ['security-baseline/**', '.github/workflows/security-baseline-selftest.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  engine-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline tier-engine self-test
        working-directory: security-baseline
        run: node scripts/selftest.mjs

  rules-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install semgrep (telemetry off)
        run: python3 -m pip install --quiet --disable-pip-version-check semgrep
      - name: Vendored rule-pack self-test (semgrep --test)
        working-directory: security-baseline
        env: { SEMGREP_SEND_METRICS: 'off' }
        run: bash scripts/selftest-rules.sh

  self-scan-smoke:
    runs-on: ubuntu-latest
    needs: [engine-selftest, rules-selftest]
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      # report-mode self-scan of this repo — proves the full action wires up and never blocks itself.
      # Expect `critical: 0`: the three waivers that keep it there are listed in
      # security-baseline/README.md (§Self-test), so a critical in this report is a real one.
      - uses: ./security-baseline
        with:
          scan-scope: full
          fail-on-critical: 'false'
          enable-secrets-history: 'false'
          verified-secrets: 'off'
      # Every scanner leg must LOOK on a healthy runner. The step above cannot show that: with
      # fail-on-critical: false a FAULT exits 0 too. So scan again with the scanners it installed, in
      # both scopes (trufflehog on the diff), and fail on any leg that could not look or a crash. The
      # selftest's stubs prove the classification; this is the one run of REAL scanner output through
      # outcome.mjs before a release.
      - name: Every scanner leg looked (real scanners, both scopes)
        shell: bash
        env:
          FAIL_ON_CRITICAL: 'false'
          ENABLE_SECRETS_HISTORY: 'false'
          SEMGREP_SEND_METRICS: 'off'
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          out="$RUNNER_TEMP/scanner-legs.log"
          SCAN_SCOPE=full VERIFIED_SECRETS=off node security-baseline/scripts/scan.mjs | tee "$out"
          SCAN_SCOPE=diff VERIFIED_SECRETS=on node security-baseline/scripts/scan.mjs | tee -a "$out"
          if grep -Eq 'could not look|security-baseline crashed' "$out"; then
            echo "::error title=security-baseline self-test::a scanner leg could not look on a healthy runner; see the reports above"
            exit 1
          fi
      # Both runs above are a push of this repo's linear history: a sha for a base, a checkout on a
      # branch. A pull_request run is detached on GitHub's test merge with a ref name for a base, which
      # faulted every PR run from v1.19.0 to v1.19.5 (v1.19.6); a range that holds a merge left one
      # walk short of its older commits until v1.19.7; past a clock skew gitleaks' range blocked on a
      # key the base already held until v1.19.8; what only a merge adds was read by neither scanner
      # until v1.20.0. The script builds those shapes; its header says what each pins.
      - name: PR, merge and clock-skew shapes — every commit of the range read, none of the base's blocking, and what each merge adds (real scanners)
        shell: bash
        run: bash security-baseline/scripts/selftest-pr-shape.sh
