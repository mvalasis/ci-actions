name: security-baseline self-test

# Two offline regression guards (no network, no secrets): (1) the pure tier-engine self-test
# (block-by-default, never-newly-block, promotion, redaction); (2) the vendored semgrep rule
# packs via `semgrep --test` (each bad fixture fires, each good fixture stays silent). Plus a
# report-mode self-scan smoke so a syntax/wiring break in scan.mjs is caught, a pass of the
# real scanners that fails when any leg could not look (a FAULT a green smoke would hide), and the
# shapes this repo's own pushes never produce scanned with the real trufflehog and gitleaks: a
# pull_request checkout, a PR that merged its base in, a push of a merge (every walk must reach every
# commit of the range and none of the base's), gitleaks' range past a clock skew (a key the base
# already holds must warn, never block), merges that add lines of their own (each key a merge adds
# must be read, and none its base held), and a range whose own git log dies, where each real scanner
# reads nothing and exits 0 (the log run first must fault). And the pinned installs (v1.21.0): a
# wrong digest fails the action's install step and installs nothing, and selftest-pins.sh holds the
# installer to its pins and to the real release assets.

on:
  push:
    branches: [main]
    paths: ['security-baseline/**', '.github/workflows/security-baseline-selftest.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  engine-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Offline tier-engine self-test
        working-directory: security-baseline
        run: node scripts/selftest.mjs

  rules-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The semgrep callers run: the hashed lock, through the action's own installer.
      - name: Install semgrep (pinned, every package hash-checked)
        run: bash security-baseline/scripts/install-pinned.sh semgrep
      - name: Vendored rule-pack self-test (semgrep --test)
        working-directory: security-baseline
        env: { SEMGREP_SEND_METRICS: 'off' }
        run: bash scripts/selftest-rules.sh

  self-scan-smoke:
    runs-on: ubuntu-latest
    needs: [engine-selftest, rules-selftest]
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      # report-mode self-scan of this repo — proves the full action wires up and never blocks itself.
      # Expect `critical: 0`: the three waivers that keep it there are listed in
      # security-baseline/README.md (§Self-test), so a critical in this report is a real one.
      - uses: ./security-baseline
        with:
          scan-scope: full
          fail-on-critical: 'false'
          enable-secrets-history: 'false'
          verified-secrets: 'off'
      # Every scanner leg must LOOK on a healthy runner. The step above cannot show that: with
      # fail-on-critical: false a FAULT exits 0 too. So scan again with the scanners it installed, in
      # both scopes (trufflehog on the diff), and fail on any leg that could not look or a crash. The
      # selftest's stubs prove the classification; this is the one run of REAL scanner output through
      # outcome.mjs before a release.
      - name: Every scanner leg looked (real scanners, both scopes)
        shell: bash
        env:
          FAIL_ON_CRITICAL: 'false'
          ENABLE_SECRETS_HISTORY: 'false'
          SEMGREP_SEND_METRICS: 'off'
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          out="$RUNNER_TEMP/scanner-legs.log"
          SCAN_SCOPE=full VERIFIED_SECRETS=off node security-baseline/scripts/scan.mjs | tee "$out"
          SCAN_SCOPE=diff VERIFIED_SECRETS=on node security-baseline/scripts/scan.mjs | tee -a "$out"
          if grep -Eq 'could not look|security-baseline crashed' "$out"; then
            echo "::error title=security-baseline self-test::a scanner leg could not look on a healthy runner; see the reports above"
            exit 1
          fi
      # Both runs above are a push of this repo's linear history: a sha for a base, a checkout on a
      # branch. A pull_request run is detached on GitHub's test merge with a ref name for a base, which
      # faulted every PR run from v1.19.0 to v1.19.5 (v1.19.6); a range that holds a merge left one
      # walk short of its older commits until v1.19.7; past a clock skew gitleaks' range blocked on a
      # key the base already held until v1.19.8; what only a merge adds was read by neither scanner
      # until v1.20.0; a range whose own git log dies read as clean until v1.20.1. The script builds
      # those shapes; its header says what each pins.
      - name: PR, merge and clock-skew shapes — every commit of the range read, none of the base's blocking, and what each merge adds (real scanners)
        shell: bash
        run: bash security-baseline/scripts/selftest-pr-shape.sh

  # Every tool the action installs is checked against a SHA-256 before it is installed (v1.21.0).
  # self-scan-smoke above installs every pin through action.yml; this job proves the other half:
  # a digest that does not match fails the ACTION's step and installs nothing. It runs the action
  # first, on a fresh runner (asserted), so what it finds afterwards is what the action did; then
  # selftest-pins.sh tests the installer itself against the real assets and the lock.
  pinned-installs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Precondition — no semgrep, no /usr/local/bin/gitleaks on this runner yet
        shell: bash
        run: |
          if command -v semgrep || [ -e /usr/local/bin/gitleaks ]; then
            echo "::error title=security-baseline self-test::the runner image already has semgrep or /usr/local/bin/gitleaks, so the end-to-end check below cannot tell what the action installed"
            exit 1
          fi
      # 8.30.0's real digest given for 8.30.1: well-formed, published, and wrong for this asset.
      - name: A wrong gitleaks-sha256 fails the action (end to end, expected to fail)
        id: wrong-digest
        continue-on-error: true
        uses: ./security-baseline
        with:
          gitleaks-sha256: '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e'
          fail-on-critical: 'false'
          enable-secrets-history: 'false'
          verified-secrets: 'off'
      # Failure alone would pass for any reason (a download that failed, a path that did not
      # resolve). semgrep present = the action got past its first step to gitleaks'; gitleaks
      # absent = that step installed nothing; self-scan-smoke installs the same gitleaks with the
      # pinned digest, so the digest is the only difference.
      - name: The action failed at gitleaks' digest, having installed semgrep and no gitleaks
        shell: bash
        env:
          OUTCOME: ${{ steps.wrong-digest.outcome }}
        run: |
          fail=0
          pinned="$(sed -n 's/^semgrep==\([^ ;\\]*\).*/\1/p' security-baseline/semgrep-requirements.txt)"
          [ "$OUTCOME" = failure ] || { echo "::error title=security-baseline self-test::a wrong gitleaks-sha256 left the action's outcome '$OUTCOME', not failure"; fail=1; }
          [ -n "$pinned" ] && [ "$(SEMGREP_SEND_METRICS=off semgrep --version 2>/dev/null)" = "$pinned" ] || { echo "::error title=security-baseline self-test::the action did not reach its gitleaks step (no semgrep ${pinned:-?} on PATH), so its failure is not the digest's"; fail=1; }
          [ ! -e /usr/local/bin/gitleaks ] || { echo "::error title=security-baseline self-test::gitleaks was installed despite a wrong digest"; fail=1; }
          exit "$fail"
      - name: The installer — pins against every action.yml, the real assets refused and accepted, semgrep's lock
        shell: bash
        run: bash security-baseline/scripts/selftest-pins.sh
