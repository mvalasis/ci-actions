name: 'Security baseline (SAST + secrets + SCA + supply-chain)'
description: >-
  Air-gapped security gate. CRITICAL core (blocks): semgrep community SAST (ERROR, diff) +
  gitleaks pattern secrets (diff) + trufflehog verified-live secrets. Everything else —
  custom WP/PHP & Astro/TS rules, dependency/SCA (osv-scanner), GitHub-Actions supply-chain,
  full-history & working-tree secrets, Dockerfile lint, license — ships as WARN, per-caller
  promotable to CRITICAL via `critical-checks`. No source leaves the runner (see README
  §Sovereignty for the exact, opt-out-able egress points).

inputs:
  # ---- scope / mode (back-compatible with the prior action) ----
  scan-scope:
    description: 'diff (changed files vs base-ref — fast, PR-friendly) or full (whole tree).'
    required: false
    default: 'diff'
  base-ref:
    description: 'Base git ref for diff scope. Auto: PR base → push event.before → HEAD~1.'
    required: false
    default: ''
  fail-on-critical:
    description: 'true = BLOCK when a CRITICAL (T0, or a promoted T1) fires, and FAULT (exit 1, a tool fault, not a finding) when a scanner leg that could have found one could not look; false = report-only. Default true — this is the fleet''s always-on gate.'
    required: false
    default: 'true'
  critical-checks:
    description: >-
      Comma/space list of T1 (promotable-WARN) check ids to ELEVATE to CRITICAL for THIS caller
      (e.g. "sca-critical,wp-sql-unprepared,wp-rest-error-detail,gha-unpinned-action"). T0 ids are
      already critical; T2 / reserved / unknown ids are reported and ignored. Empty (default) = the
      CRITICAL core only, so a caller is never newly-blocked by an upgrade.
    required: false
    default: ''
  first-party-owners:
    description: >-
      Comma/space list of EXTRA GitHub owners to treat as first-party for the `gha-unpinned-action`
      supply-chain check (their `owner/repo@tag` refs are yours, not an untrusted upstream, and are
      deliberately floating-tag-pinned by the fleet's versioning policy). Already first-party without
      configuring anything: `actions`/`github`, the CALLER's own owner (`github.repository`), and
      THIS action's own owner (`github.action_repository`) — the last of which is what keeps a
      caller quiet after an ownership split moves it away from the action's account. Use this input
      only for a THIRD owner, e.g. a second org that publishes actions you also control.
    required: false
    default: ''
  report-mode:
    description: 'Onboarding escape hatch: true = report even T0 criticals without blocking (loud banner). Must stay false for an enforcing caller.'
    required: false
    default: 'false'
  report-mode-reason:
    description: 'Required note echoed in the summary when report-mode is true (why this repo is not enforcing yet).'
    required: false
    default: ''
  # ---- SAST ----
  semgrep-config:
    description: 'Community/registry ruleset for the CRITICAL SAST block (a registry id like p/security-audit, or a vendored local path for full air-gap). The custom WARN rule packs are always vendored-local.'
    required: false
    default: 'p/security-audit'
  semgrep-severity:
    description: 'Minimum community-rule severity that BLOCKS (ERROR | WARNING | INFO). ERROR = today''s behavior.'
    required: false
    default: 'ERROR'
  # ---- secrets ----
  verified-secrets:
    description: >-
      auto | on | off — trufflehog --only-verified live-credential probe. NOTE: auto == on (egress
      ON by default): when a candidate secret is in scope it sends a test-auth to that credential's
      OWN provider. Set off for a fully air-gapped runner (no probe; the gitleaks pattern floor
      still blocks). off is also the only way to run without trufflehog: on the diff it is a
      blocking leg, so a trufflehog that cannot run FAULTs the scan.
    required: false
    default: 'auto'
  enable-secrets-history:
    description: 'Full-history secret baseline (WARN, never blocks). Set false to skip on large repos / save CI minutes.'
    required: false
    default: 'true'
  fail-on-secrets:
    description: 'DEPRECATED (kept for back-compat). Secret blocking is governed by the T0 tier + fail-on-critical; use report-mode / fail-on-critical:false to disable.'
    required: false
    default: 'true'
  # ---- SCA ----
  enable-sca:
    description: 'Dependency/SCA audit via osv-scanner (WARN; egress: package coordinates → osv.dev). Set false to disable. A run that cannot complete is reported, and FAULTs the scan only if an sca-* check is promoted via critical-checks.'
    required: false
    default: 'true'
  # ---- pinned tools: every download is checked against a SHA-256 before it is installed ----
  # A caller overriding a *-version must also set the matching *-sha256, or the step fails:
  # nothing is installed that does not hash to a pin (README §Pinned tools).
  semgrep-version:
    description: 'Pinned semgrep version, installed with every dependency from the hashed lock semgrep-requirements.txt (pip --require-hashes). Empty = the pinned version. Overriding it requires semgrep-sha256.'
    required: false
    default: '1.178.0'
  semgrep-sha256:
    description: 'SHA-256 of the semgrep wheel pip installs for semgrep-version on the runner (GitHub-hosted ubuntu: the manylinux x86_64 wheel). Required when semgrep-version is overridden. Its dependencies stay the lock''s, pinned and hashed, so a version they do not satisfy fails the step.'
    required: false
    default: ''
  gitleaks-version:
    description: 'Pinned gitleaks release (no "v"). Overriding it requires gitleaks-sha256.'
    required: false
    default: '8.30.1'
  gitleaks-sha256:
    description: 'SHA-256 of gitleaks_<version>_linux_x64.tar.gz. Required when gitleaks-version is overridden; empty = the pinned digest (tool-pins.txt).'
    required: false
    default: ''
  trufflehog-version:
    description: 'Pinned trufflehog release (no "v"). Overriding it requires trufflehog-sha256.'
    required: false
    default: '3.95.6'
  trufflehog-sha256:
    description: 'SHA-256 of trufflehog_<version>_linux_amd64.tar.gz. Required when trufflehog-version is overridden; empty = the pinned digest (tool-pins.txt).'
    required: false
    default: ''
  osv-version:
    description: 'Pinned osv-scanner release (with "v"). Overriding it requires osv-sha256.'
    required: false
    default: 'v2.4.0'
  osv-sha256:
    description: 'SHA-256 of that release''s osv-scanner_linux_amd64. Required when osv-version is overridden; empty = the pinned digest (tool-pins.txt).'
    required: false
    default: ''
  hadolint-version:
    description: 'Pinned hadolint release (no "v"). Only invoked when a Dockerfile is in scope. Overriding it requires hadolint-sha256.'
    required: false
    default: '2.12.0'
  hadolint-sha256:
    description: 'SHA-256 of that release''s hadolint-Linux-x86_64. Required when hadolint-version is overridden; empty = the pinned digest (tool-pins.txt).'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Each tool is downloaded, checked against its SHA-256 (tool-pins.txt, the hashed lock
    # semgrep-requirements.txt, or the caller's own *-sha256 beside an overridden *-version) and
    # only then installed; a mismatch, a missing digest or a failed download fails the step before
    # anything runs. Inputs reach the script through env, never spliced into its text.
    - name: Install semgrep (pinned, every package hash-checked; telemetry off)
      shell: bash
      env:
        PIN_VERSION: ${{ inputs.semgrep-version }}
        PIN_SHA256: ${{ inputs.semgrep-sha256 }}
      run: bash "${{ github.action_path }}/scripts/install-pinned.sh" semgrep
    - name: Install gitleaks (pinned, SHA-256 verified)
      shell: bash
      env:
        PIN_VERSION: ${{ inputs.gitleaks-version }}
        PIN_SHA256: ${{ inputs.gitleaks-sha256 }}
      run: bash "${{ github.action_path }}/scripts/install-pinned.sh" gitleaks
    - name: Install trufflehog (pinned, SHA-256 verified, no telemetry)
      shell: bash
      env:
        PIN_VERSION: ${{ inputs.trufflehog-version }}
        PIN_SHA256: ${{ inputs.trufflehog-sha256 }}
      run: bash "${{ github.action_path }}/scripts/install-pinned.sh" trufflehog
    - name: Install osv-scanner (pinned, SHA-256 verified)
      shell: bash
      env:
        PIN_VERSION: ${{ inputs.osv-version }}
        PIN_SHA256: ${{ inputs.osv-sha256 }}
      # `--version` smoke-checks that the verified binary runs on this runner.
      run: |
        bash "${{ github.action_path }}/scripts/install-pinned.sh" osv-scanner
        osv-scanner --version
    - name: Install hadolint (pinned, SHA-256 verified; used only when a Dockerfile is in scope)
      shell: bash
      env:
        PIN_VERSION: ${{ inputs.hadolint-version }}
        PIN_SHA256: ${{ inputs.hadolint-sha256 }}
      run: |
        bash "${{ github.action_path }}/scripts/install-pinned.sh" hadolint
        hadolint --version
    - name: Scan
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        SCAN_SCOPE: ${{ inputs.scan-scope }}
        BASE_REF: ${{ inputs.base-ref }}
        GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        # The PR's own head, empty off a pull_request. trufflehog walks back from it, not from the
        # test merge actions/checkout leaves a PR on (scan.mjs trufflehogRange, v1.19.6).
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        CRITICAL_CHECKS: ${{ inputs.critical-checks }}
        # First-party ownership for the GHA supply-chain rule. Passed EXPLICITLY rather than relying
        # on the runner's ambient defaults, so the contract is readable here and the scan behaves
        # identically under `act`/local runs. `github.action_repository` is EMPTY when the action is
        # invoked by a local `./` ref (this repo's own selftest smoke job does exactly that) —
        # scan.mjs drops empty owners instead of admitting an ''-owner that matches all.
        GITHUB_REPOSITORY: ${{ github.repository }}
        # DELIBERATELY NOT SPELLED `GITHUB_ACTION_REPOSITORY`, which is the obvious spelling and the
        # wrong one. The runner already exports an ambient GITHUB_ACTION_REPOSITORY with the same
        # documented meaning; writing the context value into that same name SHADOWS it, so the whole
        # split fix would rest on two things GitHub does not document — that the context is populated
        # inside a COMPOSITE action's own steps, and that a step `env:` may override a `GITHUB_*`
        # default. If either is false the shadow writes an empty string over a correct ambient value
        # and this action silently reverts to caller-owner-only: 32 first-party refs come back as
        # third-party WARN noise on the six org callers, i.e. exactly the symptom the change exists
        # to remove, with nothing red anywhere. scan.mjs reads THIS key first and the ambient one as
        # a fallback — reading both can only ever ADD an owner, never remove one, so it cannot make
        # a caller newly-block. (Same reasoning, same spelling, as deps-currency's `ACTION_REPOSITORY`.)
        ACTION_REPOSITORY: ${{ github.action_repository }}
        FIRST_PARTY_OWNERS: ${{ inputs.first-party-owners }}
        REPORT_MODE: ${{ inputs.report-mode }}
        REPORT_MODE_REASON: ${{ inputs.report-mode-reason }}
        SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        SAST_SEVERITY: ${{ inputs.semgrep-severity }}
        VERIFIED_SECRETS: ${{ inputs.verified-secrets }}
        ENABLE_SECRETS_HISTORY: ${{ inputs.enable-secrets-history }}
        ENABLE_SCA: ${{ inputs.enable-sca }}
        SEMGREP_SEND_METRICS: 'off'
      run: node "${{ github.action_path }}/scripts/scan.mjs"
