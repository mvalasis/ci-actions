name: 'Verify homepage — structure + cross-viewport render'
description: >-
  Renders each live page in headless Chromium across a viewport matrix
  (desktop / laptop / mobile) and BLOCKS on broken layout: horizontal overflow,
  collapsed (0-height) landmarks, overlapping in-flow landmarks — plus a nav
  inventory assert (the primary-nav items present, in declared order, against a
  tiny per-repo verify-nav.json) so a silently wrong / missing / reordered menu
  fails the gate. Mechanical structure/render = BLOCK; visual taste stays
  advisory (design-critic). Opt-in `checks: affordance` adds an interaction-
  affordance check (labelled/label-in-name/clickable-label checkboxes, pointer
  cursor), report-only unless fail-on-affordance. Opt-in `checks: focus | forms |
  target | motion | consent` (v1.27.0) add keyboard-focus, form-usability, WCAG 2.5.8
  target-size, reduced-motion + layout-shift and first-visit consent-banner checks, each
  report-only unless its own fail-on-<check>. Cost:
  the browser matrix is meant for the WEEKLY schedule + cutover, NOT per-push.

inputs:
  urls:
    description: 'Space/newline-separated live URLs to verify (production at cutover, never a preview host).'
    required: true
  nav-file:
    description: 'Path (relative to the caller checkout) to the nav-inventory + landmarks file. Empty/missing = nav check skipped AND landmarks fall back to header/main/footer (render still runs). Its `landmarks` apply regardless of `checks`.'
    required: false
    default: 'scripts/verify-nav.json'
  viewports:
    description: 'Comma-separated viewport matrix as [name:]WxH. Widths ≤600 emulate mobile (touch + meta-viewport).'
    required: false
    default: 'desktop:1920x1080,laptop:1440x900,iphone:393x852,android:384x854'
  checks:
    description: 'Comma list of: render (overflow/overlap/collapse), nav (inventory), affordance (opt-in: checkbox/radio labelled + label-in-name + label click toggles + computed cursor:pointer on clickable controls; judged by fail-on-affordance, not fail-on-structure), focus (opt-in: Tab-walk — skip link visible when focused, focused element not wholly covered, a focus indicator on every stop; fail-on-focus), forms (opt-in: visible label, autocomplete on identity fields, 16px inputs on phones, a required cue; fail-on-forms), target (opt-in: WCAG 2.5.8 target size via axe-core wcag22aa; fail-on-target), motion (opt-in: reduced-motion honoured + layout shift within cls-budget, in its own browser contexts; fail-on-motion), consent (opt-in: first-visit consent banner has a reject on the first layer, not smaller than accept, no pre-ticked optional box; fail-on-consent). Every opt-in family is judged by its OWN fail-on-<check>, never by fail-on-structure. `links` was retired in v1.15.0 and fails the step: the T1 link crawl is each repo''s own scripts/verify-homepage-t1.sh.'
    required: false
    default: 'render,nav'
  fail-on-structure:
    description: 'true = BLOCK on any render/nav failure; false = report-only (WARN).'
    required: false
    default: 'true'
  fail-on-affordance:
    description: 'Only for `checks: …affordance`. true = BLOCK on any affordance finding (or a fault in the check itself); false = report-only (WARN, ::warning annotations). Deliberately the OPPOSITE default of fail-on-structure: a new check reports first, and never moves the render/nav verdict.'
    required: false
    default: 'false'
  fail-on-focus:
    description: 'Only for `checks: …focus`. true = BLOCK on any focus finding (skip-link-hidden, focus-obscured, focus-no-indicator) or a fault in the check itself; false = report-only (WARN, ::warning annotations). Same opposite-of-fail-on-structure default as fail-on-affordance: a new check reports first.'
    required: false
    default: 'false'
  fail-on-forms:
    description: 'Only for `checks: …forms`. true = BLOCK on any forms finding (label-not-visible, autocomplete-missing, input-font-size, required-unmarked) or a fault in the check itself; false = report-only (WARN, ::warning annotations).'
    required: false
    default: 'false'
  fail-on-target:
    description: 'Only for `checks: …target`. true = BLOCK on any WCAG 2.5.8 target-size violation axe-core reports (or a fault in the check itself); false = report-only (WARN, ::warning annotations). The under-44px count is a statistic, never a finding.'
    required: false
    default: 'false'
  fail-on-motion:
    description: 'Only for `checks: …motion`. true = BLOCK on any motion finding (reduced-motion-animation, reduced-motion-smooth-scroll, cls over cls-budget) or a fault in the check itself; false = report-only (WARN, ::warning annotations).'
    required: false
    default: 'false'
  cls-budget:
    description: 'Only for `checks: …motion`. Cumulative layout shift (summed over the load, per viewport) above this is a `cls` finding. 0.1 is the Core Web Vitals "good" line. Lab data from a headless run — expect variance near the budget.'
    required: false
    default: '0.1'
  fail-on-consent:
    description: 'Only for `checks: …consent`. true = BLOCK on any consent finding (consent-no-reject, consent-reject-smaller, consent-prechecked) or a fault in the check itself; false = report-only (WARN, ::warning annotations). No banner found is never a finding.'
    required: false
    default: 'false'
  consent-selector:
    description: 'Only for `checks: …consent`. CSS selector of the first-visit consent banner, overriding detection (a fixed/sticky element or dialog holding an accept control). Empty = detect. A selector that matches nothing is a note, not a finding.'
    required: false
    default: ''
  max-urls:
    description: 'Cap the number of URLs rendered (the browser matrix is the costly part).'
    required: false
    default: '12'
  verify-token:
    description: 'Optional WAF/CF-bypass token, sent as X-Verify-Source ONLY to the target host + its www/apex variants (Cloudflare-tunnel / WAF-fronted origins).'
    required: false
    default: ''
  wait-ms:
    description: 'Settle time (ms) after load+networkidle before measuring, for responsive JS / late layout.'
    required: false
    default: '1200'
  overflow-tolerance:
    description: 'Horizontal-overflow slack in px (scrollWidth − clientWidth) before failing.'
    required: false
    default: '2'
  overlap-tolerance:
    description: 'Landmark-overlap slack in px (both axes) before failing.'
    required: false
    default: '4'

runs:
  using: composite
  steps:
    - name: Install Playwright + Chromium
      if: ${{ contains(inputs.checks, 'render') || contains(inputs.checks, 'nav') || contains(inputs.checks, 'affordance') || contains(inputs.checks, 'focus') || contains(inputs.checks, 'forms') || contains(inputs.checks, 'target') || contains(inputs.checks, 'motion') || contains(inputs.checks, 'consent') }}
      shell: bash
      working-directory: ${{ github.action_path }}
      # playwright and axe-core (the `target` check; the version a11y-audit's pa11y already runs) are the
      # only dependencies, pinned + lockfile'd; --ignore-scripts
      # blocks dependency lifecycle scripts (matches seo-aeo's hardening). The
      # chromium engine + its OS libs come from the EXPLICIT install step below,
      # not a postinstall, so --ignore-scripts is safe here.
      run: |
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        npx playwright install --with-deps chromium

    - name: Structure + cross-viewport render (+ nav inventory, + affordance, + focus/forms/target/motion/consent)
      if: ${{ contains(inputs.checks, 'render') || contains(inputs.checks, 'nav') || contains(inputs.checks, 'affordance') || contains(inputs.checks, 'focus') || contains(inputs.checks, 'forms') || contains(inputs.checks, 'target') || contains(inputs.checks, 'motion') || contains(inputs.checks, 'consent') }}
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        URLS: ${{ inputs.urls }}
        NAV_FILE: ${{ inputs.nav-file != '' && format('{0}/{1}', github.workspace, inputs.nav-file) || '' }}
        VIEWPORTS: ${{ inputs.viewports }}
        CHECKS: ${{ inputs.checks }}
        FAIL_ON_STRUCTURE: ${{ inputs.fail-on-structure }}
        FAIL_ON_AFFORDANCE: ${{ inputs.fail-on-affordance }}
        FAIL_ON_FOCUS: ${{ inputs.fail-on-focus }}
        FAIL_ON_FORMS: ${{ inputs.fail-on-forms }}
        FAIL_ON_TARGET: ${{ inputs.fail-on-target }}
        FAIL_ON_MOTION: ${{ inputs.fail-on-motion }}
        FAIL_ON_CONSENT: ${{ inputs.fail-on-consent }}
        CLS_BUDGET: ${{ inputs.cls-budget }}
        CONSENT_SELECTOR: ${{ inputs.consent-selector }}
        MAX_URLS: ${{ inputs.max-urls }}
        VERIFY_TOKEN: ${{ inputs.verify-token }}
        WAIT_MS: ${{ inputs.wait-ms }}
        OVERFLOW_TOL: ${{ inputs.overflow-tolerance }}
        OVERLAP_TOL: ${{ inputs.overlap-tolerance }}
      run: node scripts/render-check.mjs

    # RETIRED in v1.15.0 (2026-09-25). No caller ever enabled `links`, and its
    # script was a v1-lineage copy of the per-repo verify-homepage-t1.sh that
    # fell three versions behind — serial, one exit code, and the ARGUMENT as its
    # same-origin filter, the bug the per-repo v2.2 fixes. A caller that still
    # asks for it fails here instead of silently getting no crawl.
    - name: Link crawl (T1) — retired
      if: ${{ contains(inputs.checks, 'links') }}
      shell: bash
      run: |
        echo "::error title=verify-homepage::checks: links was retired in ci-actions v1.15.0. Run the repo's own scripts/verify-homepage-t1.sh for the T1 link crawl, and drop 'links' from checks."
        exit 1
