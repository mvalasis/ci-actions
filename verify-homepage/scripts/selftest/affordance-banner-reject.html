<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>affordance fixture — cookie banner with a reject</title>
<!-- A first-visit cookie banner (with a Reject on its first layer) covers the consent label — the EPN /apply/ shape of 2026-10-07. A fresh browser context always sees it, so the label-click leg must reject it once and look again, NOT report the banner as a defect of the page. The checkbox sits far down the page so the click leg scrolls it to the middle of the viewport,
     where the fixed cover (the lower 60% of the screen) sits over it. The control shows the pointer, so
     only the label-click rule can speak. -->
<style>
  body { margin: 0; padding: 16px 16px 1600px; font: 16px/1.4 sans-serif; }
  button, input, label, a[href] { cursor: pointer; }
  .spacer { height: 1400px; }
  .cover { position: fixed; left: 0; right: 0; top: 40vh; bottom: 0; background: #222; color: #fff; padding: 16px; z-index: 50; }
  .cover[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>cookie banner with a reject</h1>
  <div class="spacer"></div>
  <form onsubmit="return false"><label><input type="checkbox" id="target"> I agree to the terms</label></form>
</main>
<div class="cover" id="cb" role="dialog" aria-label="Cookie consent"><p>We use cookies.</p><button type="button" onclick="document.getElementById('cb').hidden = true">Accept all</button> <button type="button" onclick="document.getElementById('cb').hidden = true">Reject</button></div>
</body>
</html>
