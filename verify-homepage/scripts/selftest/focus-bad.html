<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>focus fixture — BAD</title>
<!-- Every `focus` rule must fire here, and each exclusion must hold:
       skip-link-hidden   the skip link sits at y 0–25 BEHIND a fixed 120px header (the EPN shape)
       focus-obscured     a fixed link wholly under the fixed bottom banner, and a footer link at the end of a
                          long page that Chrome scrolls to the bottom edge — under the same banner (EPN's /search/)
       focus-no-indicator an anchor and a button with `outline: none` and no box-shadow
     NOT findings: a link only PARTLY under the banner (counted in the stats), an input that draws its ring as a
     box-shadow, a third-party iframe and a `.cf-turnstile` host with no ring, a 1px visually-hidden checkbox. -->
<style>
  html, body { margin: 0; font: 16px/1.4 sans-serif; }
  .skip { position: absolute; top: 0; left: 0; height: 25px; padding: 0 8px; background: #000; color: #fff; }
  header.bar { position: fixed; top: 0; left: 0; right: 0; height: 120px; background: #eee; z-index: 20; }
  main { padding: 140px 16px 0; height: 1200px; }
  .banner { position: fixed; left: 0; right: 0; bottom: 0; height: 100px; background: #223; color: #fff; z-index: 30; padding: 8px; box-sizing: border-box; }
  .banner button { height: 36px; }
  a#partial { position: fixed; left: 20px; bottom: 90px; height: 40px; width: 160px; background: #ddd; z-index: 10; }
  a#hidden { position: fixed; left: 20px; bottom: 30px; height: 30px; width: 160px; background: #ddd; z-index: 10; }
  a#noring, button#noring2 { outline: none; }
  input#ring { outline: none; box-shadow: 0 0 0 3px #36c; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); outline: none; }
  footer { position: absolute; top: 1330px; left: 16px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">Site header</header>
<main id="main">
  <h1>Focus — bad</h1>
  <p><a id="noring" href="#a">Link with no ring</a></p>
  <p><button id="noring2" type="button">Button with no ring</button></p>
  <p><input id="ring" type="text" aria-label="Ring as a box-shadow"></p>
  <p><iframe title="third party" srcdoc="<button>inside</button>" style="outline:none;width:200px;height:50px"></iframe></p>
  <div class="cf-turnstile"><div tabindex="0" style="outline:none;width:100px;height:30px">widget</div></div>
  <p><input class="sr" type="checkbox" aria-label="Hidden native box"></p>
</main>
<footer><a id="foot" href="#foot">Footer link</a></footer>
<a id="partial" href="#p">Partly under the banner</a>
<a id="hidden" href="#h">Under the banner</a>
<div class="banner" role="dialog" aria-label="Cookies"><p>We use cookies.</p><button type="button">OK</button></div>
</body>
</html>
